[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transitpulse"
version = "1.0.0"
description = "An explainable, spatiotemporal machine learning platform for predicting public transport delays using historical transit operations, weather conditions, urban events and geospatial intelligence."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Thrilok Manjunath", email = "thrilokmanjunath@gmail.com" }
]
license = "MIT"
keywords = [
    "transit", "delay-prediction", "machine-learning", "spatiotemporal",
    "bmtc", "weather", "events", "xgboost", "lightgbm", "shap", "fastapi", "streamlit"
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.0",
    "optuna>=3.6.0",
    "joblib>=1.3.0",
    "shap>=0.45.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "streamlit>=1.33.0",
    "plotly>=5.20.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.19.0",
    "mlflow>=2.12.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "ruff>=0.4.0"
]

[project.scripts]
transitpulse = "transitpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W293", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
